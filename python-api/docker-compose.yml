services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: order_ai
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp", "-papp"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: mysql+pymysql://app:app@mysql:3306/order_ai
    ports: ["8000:8000"]
    depends_on:
      mysql:
        condition: service_healthy
