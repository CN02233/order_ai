services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: order_ai
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp", "-papp"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: mysql+pymysql://app:app@mysql:3306/order_ai
      # EN: Optional LLM settings; empty key means rule fallback.
      # 中文：LLM 配置为可选项；Key 为空时走规则降级。
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-15}
    ports: ["8000:8000"]
    depends_on:
      mysql:
        condition: service_healthy
